# cargo-deny policy. `pnpm scan:deps` runs `cargo deny check bans licenses sources`.
# cargo-audit checks security advisories separately.

[graph]
all-features = false

[licenses]
# Permissive licences only. Add a licence only after a review of its terms.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# This crate is not published.
ignore = true

[bans]
# Duplicate versions are reported but allowed: some come from upstream crates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
